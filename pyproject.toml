[project]
name = "constellation"
version = "0.1.0"
description = "The company brain that proves every answer, on FalkorDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "falkordb>=1.8",
    "huggingface-hub>=0.35",
    "polars>=1.34",
    "pyyaml>=6.0",
    "redis>=5",
]

[dependency-groups]
dev = [
  "bandit>=1.8",
  "deptry>=0.23",
  "hypothesis>=6.140",
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.14",
  "testcontainers>=4.13",
  "types-pyyaml>=6.0.12.20260906",
  "vulture>=2.14",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constellation"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C4", "PERF", "PIE", "RET", "TID"]

[tool.ruff.lint.per-file-ignores]
# asserts are the test language
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src", "tools"]

[[tool.mypy.overrides]]
# falkordb-py ships no type information; ReadPort is the typed boundary around it
module = ["falkordb", "falkordb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
markers = [
  "ac(id): links a test to a PLAN_SPEC acceptance criterion",
  "integration: needs Docker (FalkorDB testcontainer)",
]

[tool.vulture]
paths = ["src", "tools"]
min_confidence = 80
