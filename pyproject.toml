[project]
name = "constellation"
version = "0.1.0"
description = "The company brain that proves every answer, on FalkorDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "falkordb>=1.8",
    "fastapi>=0.159.1",
    "fastmcp>=2.12",
    "huggingface-hub>=0.35",
    "mcp>=2.3",
    "numpy>=2.5.4",
    "polars>=1.34",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "redis>=5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
  "bandit>=1.8",
  "deptry>=0.23",
  "httpx>=0.28",
  "hypothesis>=6.140",
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.14",
  "testcontainers>=4.13",
  "types-pyyaml>=6.0.12.20260906",
  "vulture>=2.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constellation"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests", "tools"]
# verbatim third-party code is regenerated, never edited; our rules do not apply to it
extend-exclude = ["src/constellation/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C4", "PERF", "PIE", "RET", "TID"]

[tool.ruff.lint.per-file-ignores]
# asserts are the test language; seeded sampling is reproducibility; fake credentials prove redaction
"tests/**" = ["S101", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src", "tools"]
# vendored OrgForge code is untyped by design; only its call sites are allowed to reach it
untyped_calls_exclude = ["constellation._vendor"]

[[tool.mypy.overrides]]
module = ["constellation._vendor.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# falkordb-py, scipy and scikit-learn ship no type information; ReadPort and Bm25Index are the typed boundaries
module = ["falkordb", "falkordb.*", "scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
markers = [
  "ac(id): links a test to a PLAN_SPEC acceptance criterion",
  "integration: needs Docker (FalkorDB testcontainer)",
]

[tool.vulture]
paths = ["src", "tools"]
exclude = ["src/constellation/_vendor/"]
min_confidence = 80
