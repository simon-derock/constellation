name: keep-warm

# Render's free tier sleeps after 15 idle minutes; a ping every 10 keeps the demo answering instantly.
# API_URL is a repository variable (Settings → Secrets and variables → Actions → Variables), not a secret.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL is not set; nothing to ping"; exit 0; fi
          curl --fail --silent --show-error --max-time 90 --retry 2 "$API_URL/health"
